name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Диапазон Python, который поддерживает Hermes (requires-python >=3.11,<3.15).
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # Совместимость с настоящим Hermes на закреплённой ревизии (docs/compatibility.md). Не запускалась: проверяется на этапе 9.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ["P", "A", "B", "G", "Q", "I", "H", "N", "Z", "L", "R", "T"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.2
          path: hermes
      - name: Pinned revision
        run: test "$(git -C hermes rev-parse HEAD)" = "ae2a81ccc00e9b7c06301523e5bb09608397149c"
      - uses: astral-sh/setup-uv@v5
      - name: Hermes dependencies
        working-directory: hermes
        # messaging (python-telegram-bot) вынесен из `all` (lazy-install), а run.sh отключает ленивую установку.
        run: uv sync --locked --python 3.14 --extra all --extra messaging
      - name: Compatibility tests
        run: bash compat/run.sh hermes hermes/.venv/bin/python ${{ matrix.group }}
